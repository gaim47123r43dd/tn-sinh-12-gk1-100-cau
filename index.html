const Q=RAW.split("\n").map(l=>{const a=l.split("|");return{q:a[0],c:a[1],o:a.slice(1)}});
const $=id=>document.getElementById(id);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const allQ=()=>Q.slice(),pick=n=>shuf(Q).slice(0,n);
let set,i,score,wrong,done,st=0;
$("n").textContent=Q.length;
function show(id){["home","play","end"].forEach(s=>$(s).classList.toggle("hide",s!==id))}
function start(list){set=shuf(list);i=0;score=0;st=0;wrong=[];show("play");render()}
function render(){
 const k=set[i];done=false;
 $("pos").textContent="Câu "+(i+1)+"/"+set.length;$("sc").textContent="Điểm: "+score;
 $("pb").style.width=(i/set.length*100)+"%";$("q").textContent=k.q;$("nx").classList.add("hide");
 const box=$("opts");box.innerHTML="";
 shuf(k.o).forEach((t,n)=>{const b=document.createElement("button");b.className="opt";b.dataset.t=t;b.innerHTML='<i class="L">'+"ABCD"[n]+'</i><span>'+t+'</span>';b.onclick=()=>ans(b,t);box.appendChild(b)});
}
function ans(b,t){
 if(done)return;done=true;const k=set[i];
 [...$("opts").children].forEach(x=>{if(x.dataset.t===k.c)x.classList.add("ok")});
 if(t===k.c){score++;st++;say(st>=3?"🔥 Chuỗi "+st+" câu đúng!":["Chính xác! ✨","Đúng rồi! 🎯","Giỏi quá! 🌟"][st%3])}else{st=0;b.classList.add("no");wrong.push(k);say("Chưa đúng, xem đáp án xanh nhé 💡")}
 $("sc").textContent="Điểm: "+score+(st>1?" 🔥"+st:"");
 $("nx").textContent=i===set.length-1?"Xem kết quả":"Câu tiếp";$("nx").classList.remove("hide");
}
function say(m){const t=$("toast");t.textContent=m;t.classList.remove("pop");void t.offsetWidth;t.classList.add("pop")}
function next(){i++;i<set.length?render():finish()}
function finish(){
 show("end");const p=Math.round(score/set.length*100);
 $("res").textContent=(p>=90?"🏆 ":p>=70?"🌟 ":"💪 ")+score+"/"+set.length;
 $("msg").textContent=p>=90?"Xuất sắc! 🎉":p>=70?"Khá tốt, ôn thêm vài chỗ nhé.":p>=50?"Cần ôn lại kĩ hơn.":"Hãy xem lại bài soạn rồi thử lại nhé.";
 const w=$("wr");w.classList.toggle("hide",!wrong.length);$("rw").classList.toggle("hide",!wrong.length);
 w.innerHTML="<b>Các câu sai ("+wrong.length+")</b>"+wrong.map(k=>'<div class="w">'+k.q+'<br><span>→ '+k.c+"</span></div>").join("");
}
